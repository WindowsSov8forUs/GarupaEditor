[package]
name = "garupa-editor"
version = "0.2.0"
description = "GarupaEditor"
authors = ["GarupaEditor contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "garupa_editor_lib"
# Desktop-only project: use `rlib` to avoid generating a huge exported symbol table
# on the GNU Windows toolchain (`x86_64-pc-windows-gnu`).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart"] }
base64 = "0.22"
rfd = "0.14"
