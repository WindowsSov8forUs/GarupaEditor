name: Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PROJECT_NAME: GarupaEditor
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or reuse draft release
        id: release
        uses: actions/github-script@v7
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              ({ data: release } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `${process.env.PROJECT_NAME} ${tag}`,
                body: `自动构建 ${process.env.PROJECT_NAME} 的多平台可安装发布包。`,
                draft: true,
                prerelease: false
              }));
            }
            core.setOutput('release_id', String(release.id));

  build:
    name: ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
            tauriArgs: --target x86_64-pc-windows-msvc
          - name: Windows arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: arm64
            tauriArgs: --target aarch64-pc-windows-msvc
          - name: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            arch: x64
            tauriArgs: --target x86_64-apple-darwin --bundles app
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            tauriArgs: --target aarch64-apple-darwin --bundles app
          - name: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            tauriArgs: --target x86_64-unknown-linux-gnu --bundles deb,rpm
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            tauriArgs: --target aarch64-unknown-linux-gnu --bundles deb,rpm
          - name: Android universal
            runner: ubuntu-24.04
            target: aarch64-linux-android
            platform: android
            arch: aarch64
            androidTarget: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: pwsh
        run: |
          $required = @(
            "package-lock.json",
            "package.json",
            "src-tauri/tauri.conf.json",
            "src-tauri/Cargo.toml",
            "src/assets/default-cover.png",
            "src/assets/fonts/TTShinGoM.ttf",
            "src/assets/fonts/GB18030.ttf"
          )
          if ("${{ matrix.platform }}" -ne "android") {
            $required += @(
              "src-tauri/nsis-hooks.nsh",
              "src-tauri/icons/icon.ico",
              "src-tauri/icons/icon.icns",
              "src-tauri/icons/32x32.png",
              "src-tauri/icons/128x128.png",
              "src-tauri/icons/128x128@2x.png"
            )
          }
          if ("${{ matrix.platform }}" -eq "android") {
            $required += @(
              "src-tauri/tauri.android.conf.json",
              "src-tauri/gen/android/build.gradle.kts",
              "src-tauri/gen/android/settings.gradle",
              "src-tauri/gen/android/gradlew",
              "src-tauri/gen/android/app/build.gradle.kts",
              "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
            )
          }
          if ("${{ matrix.platform }}" -eq "windows" -and "${{ matrix.arch }}" -eq "x64") {
            $required += "release-hotfix/WebView2Loader/WebView2Loader.dll"
          }
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required release file is missing: $path"
            }
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: matrix.platform == 'android'
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13599879"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/29.0.13599879" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/29.0.13599879" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            xdg-utils
          command -v xdg-open

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Windows WebView2 loader fallback
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $loader = "release-hotfix/WebView2Loader/WebView2Loader.dll"
          if (Test-Path -LiteralPath $loader) {
            $targetDir = "src-tauri/target/${{ matrix.target }}/release"
            New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
            Copy-Item -LiteralPath $loader -Destination (Join-Path $targetDir "WebView2Loader.dll") -Force
          }

      - name: Prepare Android package version
        if: matrix.platform == 'android'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(node -e "const [major, minor, patch] = require('./package.json').version.split('.').map(Number); if ([major, minor, patch].some((value) => !Number.isInteger(value))) throw new Error('Android versionCode requires a numeric semver version'); console.log(major * 10000 + minor * 1000 + patch);")"
          {
            echo "// THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY."
            echo "tauri.android.versionName=${VERSION}"
            echo "tauri.android.versionCode=${VERSION_CODE}"
          } > src-tauri/gen/android/app/tauri.properties

      - name: Build Android release packages
        if: matrix.platform == 'android'
        run: npm run android:build -- --target ${{ matrix.androidTarget }} --apk --ci

      - name: Upload Android release packages
        if: matrix.platform == 'android'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          APK_SOURCE="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          APK_ASSET="${PROJECT_NAME}_${VERSION}_android_${{ matrix.arch }}.apk"
          test -f "$APK_SOURCE"
          cp "$APK_SOURCE" "$APK_ASSET"
          gh release upload "${{ github.ref_name }}" "$APK_ASSET" --clobber

      - name: Build and upload release bundle
        if: matrix.platform != 'macos' && matrix.platform != 'android'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.tauriArgs }}
          assetNamePattern: "${{ env.PROJECT_NAME }}_[version]_[platform]_[arch][setup][ext]"

      - name: Build macOS app bundle
        if: matrix.platform == 'macos'
        run: npm run tauri -- build ${{ matrix.tauriArgs }}

      - name: Upload macOS app archive
        if: matrix.platform == 'macos'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/${PROJECT_NAME}.app"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ASSET_ARCH="aarch64"
          else
            ASSET_ARCH="${{ matrix.arch }}"
          fi
          ARCHIVE="${PROJECT_NAME}_${VERSION}_darwin_${ASSET_ARCH}.app.tar.gz"
          test -d "$APP_PATH"
          tar -C "$(dirname "$APP_PATH")" -czf "$ARCHIVE" "$(basename "$APP_PATH")"
          gh release upload "${{ github.ref_name }}" "$ARCHIVE" --clobber
