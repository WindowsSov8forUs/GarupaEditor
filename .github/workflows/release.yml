name: Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PROJECT_NAME: GarupaEditor
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
            tauriArgs: --target x86_64-pc-windows-msvc
          - name: Windows arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: arm64
            tauriArgs: --target aarch64-pc-windows-msvc
          - name: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            arch: x64
            tauriArgs: --target x86_64-apple-darwin
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            tauriArgs: --target aarch64-apple-darwin
          - name: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            tauriArgs: --target x86_64-unknown-linux-gnu
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            tauriArgs: --target aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: pwsh
        run: |
          $required = @(
            "package-lock.json",
            "package.json",
            "src-tauri/tauri.conf.json",
            "src-tauri/Cargo.toml",
            "src-tauri/nsis-hooks.nsh",
            "src-tauri/icons/icon.ico",
            "src-tauri/icons/icon.icns",
            "src-tauri/icons/32x32.png",
            "src-tauri/icons/128x128.png",
            "src-tauri/icons/128x128@2x.png",
            "src/assets/default-cover.png",
            "src/assets/fonts/TTShinGoM.ttf",
            "src/assets/fonts/GB18030.ttf"
          )
          if ("${{ matrix.platform }}" -eq "windows" -and "${{ matrix.arch }}" -eq "x64") {
            $required += "release-hotfix/WebView2Loader/WebView2Loader.dll"
          }
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required release file is missing: $path"
            }
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Windows WebView2 loader fallback
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $loader = "release-hotfix/WebView2Loader/WebView2Loader.dll"
          if (Test-Path -LiteralPath $loader) {
            $targetDir = "src-tauri/target/${{ matrix.target }}/release"
            New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
            Copy-Item -LiteralPath $loader -Destination (Join-Path $targetDir "WebView2Loader.dll") -Force
          }

      - name: Build release bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ env.PROJECT_NAME }} ${{ github.ref_name }}
          releaseBody: "Automated installable packages for ${{ env.PROJECT_NAME }}."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauriArgs }}
          assetNamePattern: "${{ env.PROJECT_NAME }}_[version]_[platform]_[arch][setup][ext]"
